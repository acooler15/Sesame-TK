name: 📦Auto Build for N
run-name: 📦 ${{ github.actor }} @ Github Action

on:
  #  push:
  #    branches: [ "main" ]
  #  pull_request:
  #    branches: [ "main" ]
  release:
    types: [ published ]
#  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⏰ Set Timezone to Asia/Shanghai
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "Current time: $(date)"

      - name: 👨🏻‍💻 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: ☕ Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle
      - name: 🤝 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: ☎️ Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🔥 Build with Gradle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sesame-tk.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 解码签名密钥为 keystore 文件，Gradle 在构建中直接签名
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > "${{ runner.temp }}/sesame-tk.jks"
          ./gradlew assembleRelease -Pversion=${{ github.ref_name }}

      - name: 📊 Locate APKs and Set Outputs
        id: locate_apks
        run: |
          release_dir="app/build/outputs/apk/release"
          arm64_apk=$(find "$release_dir" -name "*-arm64-v8a-*.apk" | head -n 1)
          armv7_apk=$(find "$release_dir" -name "*-armeabi-v7a-*.apk" | head -n 1)
          x86_apk=$(find "$release_dir" -name "*-x86-*.apk" | head -n 1)
          x86_64_apk=$(find "$release_dir" -name "*-x86_64-*.apk" | head -n 1)
          universal_apk=$(find "$release_dir" -name "*-universal-*.apk" | head -n 1)
          echo "arm64_apk=$arm64_apk" >> $GITHUB_OUTPUT
          echo "armv7_apk=$armv7_apk" >> $GITHUB_OUTPUT
          echo "x86_apk=$x86_apk" >> $GITHUB_OUTPUT
          echo "x86_64_apk=$x86_64_apk" >> $GITHUB_OUTPUT
          echo "universal_apk=$universal_apk" >> $GITHUB_OUTPUT

      - name: 🚀 Upload APK - arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a
          path: ${{ steps.locate_apks.outputs.arm64_apk }}

      - name: 🚀 Upload APK - armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a
          path: ${{ steps.locate_apks.outputs.armv7_apk }}

      - name: 🚀 Upload APK - x86
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86
          path: ${{ steps.locate_apks.outputs.x86_apk }}

      - name: 🚀 Upload APK - x86_64
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: ${{ steps.locate_apks.outputs.x86_64_apk }}

      - name: 🚀 Upload APK - universal
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal
          path: ${{ steps.locate_apks.outputs.universal_apk }}

      - name: 🛠️ Extract file names and version
        id: extract_info
        run: |
          arm64_file=$(basename "${{ steps.locate_apks.outputs.arm64_apk }}")
          armv7_file=$(basename "${{ steps.locate_apks.outputs.armv7_apk }}")
          x86_file=$(basename "${{ steps.locate_apks.outputs.x86_apk }}")
          x86_64_file=$(basename "${{ steps.locate_apks.outputs.x86_64_apk }}")
          universal_file=$(basename "${{ steps.locate_apks.outputs.universal_apk }}")
          version="${{ github.ref_name }}"
          echo "arm64_file=$arm64_file" >> $GITHUB_OUTPUT
          echo "armv7_file=$armv7_file" >> $GITHUB_OUTPUT
          echo "x86_file=$x86_file" >> $GITHUB_OUTPUT
          echo "x86_64_file=$x86_64_file" >> $GITHUB_OUTPUT
          echo "universal_file=$universal_file" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: 🎨 Generate APKS Checksum
        run: |
          sha256sum ${{ steps.locate_apks.outputs.arm64_apk }} > CHECKSUMS-Sesame-arm64-v8a-${{ steps.extract_info.outputs.version }}.apk.sha256
          sha256sum ${{ steps.locate_apks.outputs.armv7_apk }} > CHECKSUMS-Sesame-armeabi-v7a-${{ steps.extract_info.outputs.version }}.apk.sha256
          sha256sum ${{ steps.locate_apks.outputs.x86_apk }} > CHECKSUMS-Sesame-x86-${{ steps.extract_info.outputs.version }}.apk.sha256
          sha256sum ${{ steps.locate_apks.outputs.x86_64_apk }} > CHECKSUMS-Sesame-x86_64-${{ steps.extract_info.outputs.version }}.apk.sha256
          sha256sum ${{ steps.locate_apks.outputs.universal_apk }} > CHECKSUMS-Sesame-universal-${{ steps.extract_info.outputs.version }}.apk.sha256

      - name: 📝 Generate Dynamic Message
        id: commit_info
        shell: bash
        run: |
          # 初始化一个临时文件名
          MESSAGE_FILE=$(mktemp)

          if [[ "${{ github.event_name }}" == "push" && -n '${{ toJSON(github.event.commits) }}' && '${{ toJSON(github.event.commits) }}' != 'null' && '${{ toJSON(github.event.commits) }}' != '[]' ]]; then
            echo "Source: Push Event"
            # 【修复】使用正确的 jq 语法截取 commit ID 前7个字符
            echo '${{ toJSON(github.event.commits) }}' | jq -r '.[] | "• \(.message | split("\n")[0]) (<a href=\"\(.url)\">\(.id[0:7])</a>)"' > "$MESSAGE_FILE"

          elif [[ "${{ github.event_name }}" == "pull_request" && -n '${{ toJSON(github.event.pull_request) }}' && '${{ toJSON(github.event.pull_request) }}' != 'null' ]]; then
            echo "Source: Pull Request Event"
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_URL="${{ github.event.pull_request.html_url }}"
            API_URL="${{ github.event.pull_request.commits_url }}"

            # 写入 PR 标题
            echo -e "<b>PR:</b> <a href=\"$PR_URL\">$PR_TITLE</a>\n\n<b>Commits:</b>" > "$MESSAGE_FILE"

            COMMITS_JSON=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                                -H "Accept: application/vnd.github.v3+json" \
                                "$API_URL")

            # 【修复】使用正确的 jq 语法截取 commit SHA 前7个字符
            echo "$COMMITS_JSON" | jq -r 'if type == "array" then .[] | "• \(.commit.message | split("\n")[0]) (<a href=\"\(.html_url)\">\(.sha[0:7])</a>)" else "" end' >> "$MESSAGE_FILE"

          else
            echo "Source: Manual or unknown"
            echo "手动触发构建" > "$MESSAGE_FILE"
          fi

          # 使用 GitHub Actions 官方推荐的多行输出语法
          {
            echo "message_string<<EOF"
            cat "$MESSAGE_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # 清理临时文件
          rm "$MESSAGE_FILE"

      - name: 🚀 Upload Assets to Source Release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.release.tag_name || steps.extract_info.outputs.version }}
          files: |
            ${{ steps.locate_apks.outputs.arm64_apk }}
            ${{ steps.locate_apks.outputs.armv7_apk }}
            ${{ steps.locate_apks.outputs.x86_apk }}
            ${{ steps.locate_apks.outputs.x86_64_apk }}
            ${{ steps.locate_apks.outputs.universal_apk }}
            CHECKSUMS-Sesame-arm64-v8a-${{ steps.extract_info.outputs.version }}.apk.sha256
            CHECKSUMS-Sesame-armeabi-v7a-${{ steps.extract_info.outputs.version }}.apk.sha256
            CHECKSUMS-Sesame-x86-${{ steps.extract_info.outputs.version }}.apk.sha256
            CHECKSUMS-Sesame-x86_64-${{ steps.extract_info.outputs.version }}.apk.sha256
            CHECKSUMS-Sesame-universal-${{ steps.extract_info.outputs.version }}.apk.sha256
          tag_name: ${{ steps.extract_info.outputs.version}}
          draft: false
          append_body: true
          make_latest: true
          generate_release_notes: false
          body: |
            
            > [!Important]
            >
            > ## 模块的蓬勃生机离不开社区与群组,感谢各位的贡献🎉
  
            > [!NOTE]
            > 你可以尝试点击下方图标加入我们的组织
  
            [![Telegram-Channel](https://img.shields.io/badge/Sesame--TK-nul?&logo=Telegram&label=Telegram-Channel&labelColor=fff&link=https%3A%2F%2Ft.me%2FSesame_TK_Channel)](https://t.me/Sesame_TK_Channel)   [![Telegram-Group](https://img.shields.io/badge/Sesame--TK-nul?&logo=Telegram&label=Telegram-Group&labelColor=fff&link=https%3A%2F%2Ft.me%2Ffansirsqi_xposed_sesame)](https://t.me/fansirsqi_xposed_sesame)   [![Static Badge](https://img.shields.io/badge/QQ--Channel-nul?style=flat&logo=qq&labelColor=%23fff&logoSize=12&label=%E8%85%BE%E8%AE%AF%E9%A2%91%E9%81%93&link=https%3A%2F%2Fpd.qq.com%2Fs%2Fhdvws4vuf)](https://pd.qq.com/s/hdvws4vuf)   [![Static Badge](https://img.shields.io/badge/QQ--Group-nul?style=flat&logo=qq&logoSize=12&label=QQ%E7%BE%A4%E8%81%8A&labelColor=%23fff&link=https%3A%2F%2Fqm.qq.com%2Fq%2FAj0Xby6AGQ)](https://qm.qq.com/q/Aj0Xby6AGQ)
  
            > ## 下载说明
            <b>- arm64-v8a:</b> 适用于64位ARM设备 (主流新手机)
            <b>- armeabi-v7a:</b> 适用于32位ARM设备 (旧款手机)
            <b>- x86 / x86_64:</b> 主要用于PC上的安卓模拟器
            <b>- universal:</b> 通用版 (不确定时使用，体积较大)
            >
            > **如果不确定，请下载 `universal` 版本。**

      - name: 🔁 Sync Release to Target Repository
        uses: softprops/action-gh-release@v2
        with:
          repository: Xposed-Modules-Repo/fansirsqi.xposed.sesame # 目标仓库的拥有者和仓库名称
          name: ${{ github.event.release.tag_name || steps.extract_info.outputs.version }} # 发布的名称。默认为标签名称
          files: |
            ${{ steps.locate_apks.outputs.arm64_apk }}
            ${{ steps.locate_apks.outputs.armv7_apk }}
            ${{ steps.locate_apks.outputs.x86_apk }}
            ${{ steps.locate_apks.outputs.x86_64_apk }}
            ${{ steps.locate_apks.outputs.universal_apk }}
            CHECKSUMS-Sesame-arm64-v8a-${{ steps.extract_info.outputs.version }}.apk.sha256
            CHECKSUMS-Sesame-armeabi-v7a-${{ steps.extract_info.outputs.version }}.apk.sha256
            CHECKSUMS-Sesame-x86-${{ steps.extract_info.outputs.version }}.apk.sha256
            CHECKSUMS-Sesame-x86_64-${{ steps.extract_info.outputs.version }}.apk.sha256
            CHECKSUMS-Sesame-universal-${{ steps.extract_info.outputs.version }}.apk.sha256
          token: ${{ secrets.TARGET_REPO_PAT }}
          tag_name: ${{ steps.extract_info.outputs.version}}
          draft: false
          make_latest: true
          body: |
            📦 内容同步自源仓库 [Sesame-TK](https://github.com/${{ github.repository }})
            
            ${{ github.event.release.body }}
            
            > ## 下载说明
            <b>- arm64-v8a:</b> 适用于64位ARM设备 (主流新手机)
            <b>- armeabi-v7a:</b> 适用于32位ARM设备 (旧款手机)
            <b>- x86 / x86_64:</b> 主要用于PC上的安卓模拟器
            <b>- universal:</b> 通用版 (不确定时使用，体积较大)
            >
            > **如果不确定，请下载 `universal` 版本。**
