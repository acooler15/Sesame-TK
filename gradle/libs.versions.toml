[versions]
activity-compose = "1.13.0"

android-plugin = "9.3.1"
compose-bom = "2026.08.00"
composeCompiler = "2.4.10"
kotlinxCoroutinesCore = "1.11.0"

lifecycleLivedataKtx = "2.11.0"

cmdAndroid = "0.8.2"
nanohttpd = "2.3.1"
shizukuVersion = "13.1.5"
slf4j = "2.0.18"
logback-android = "3.0.0"
okhttp = "5.4.0"
jackson = "2.21.5"
jackson-annotations = "2.21"
# libxposed 102：拦截器链模型（OkHttp 风格）、Invoker 系统、detach、热重载、HookHandle.replaceHook
libxposed = "102.0.0"
libxposedApi = "102.0.0"

core-ktx = "1.19.0"
dexkit = "2.2.0"

litert = "1.0.1"

[libraries]

androidx-material3 = { module = "androidx.compose.material3:material3" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleLivedataKtx" }
cmd-android = { module = "com.github.niki914:cmd-android", version.ref = "cmdAndroid" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesCore" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
rikka-shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizukuVersion" }
rikka-shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizukuVersion" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-android = { module = "com.github.tony19:logback-android", version.ref = "logback-android" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }

dexkit = { module = "org.luckypray:dexkit", version.ref = "dexkit" }
androidx-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }

# libxposed 新版 API（compileOnly，框架运行时提供）
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposedApi" }
# Binder 接口（service 的 POM 仅以 runtime scope 引用它，编译期需要须显式声明）
libxposed-interface = { module = "io.github.libxposed:interface", version.ref = "libxposed" }
# 服务客户端实现（XposedService/XposedServiceHelper/RemotePreferences）
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed" }

# TFLite 旧坐标（org.tensorflow）已被 Google 全线 relocation 至 LiteRT，直接声明新坐标
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
# 支持库（TensorBuffer/Model/TensorImage 等；不用 litert-support 壳——它与本库 namespace 相同会导致 AGP 9 manifest 合并冲突）
litert-support-api = { group = "com.google.ai.edge.litert", name = "litert-support-api", version.ref = "litert" }
# GPU 加速
litert-gpu = { group = "com.google.ai.edge.litert", name = "litert-gpu", version.ref = "litert" }
# 元数据处理
litert-metadata = { group = "com.google.ai.edge.litert", name = "litert-metadata", version.ref = "litert" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-plugin" }
android-library = { id = "com.android.library", version.ref = "android-plugin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }

[bundles]
litert = ["litert", "litert-support-api", "litert-gpu", "litert-metadata"]

